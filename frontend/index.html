<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrueFare Guru — AI Flight Search</title>
  <meta name="description" content="TrueFare Guru compares live flight prices, checks carry-on baggage options, and finds the best flights with direct booking links." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 24px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 1.9rem; color: #0f172a; }
    header p { margin: 6px 0 0; color: #475569; }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      margin-bottom: 20px;
    }
    .trip-tabs {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .trip-tab {
      margin: 0;
      width: auto;
      padding: 8px 18px;
      background: transparent;
      color: #334155;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    .trip-tab:hover { background: rgba(255, 255, 255, 0.5); }
    .trip-tab.active {
      background: #ffffff;
      color: #0284c7;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.1);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 14px;
    }
    .hidden { display: none !important; }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.9rem;
      color: #334155;
      cursor: pointer;
    }
    .checkbox-row input { width: auto; }
    .submit-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .submit-btn:hover { background: #0369a1; }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 0.92rem; font-weight: 500; }
    .best-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .best-box h3 { margin: 0 0 8px; color: #0369a1; font-size: 1.08rem; }
    .warn-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      color: #92400e;
    }
    .links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .link-btn {
      display: inline-block;
      padding: 7px 12px;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .link-btn:hover { background: #334155; }
    .flight-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: #ffffff;
    }
    .flight-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TrueFare Guru</h1>
      <p>Live flight search &amp; AI fare analyzer</p>
    </header>

    <div class="card">
      <div class="trip-tabs" role="tablist" aria-label="Trip type">
        <button type="button" id="tab-oneway" class="trip-tab active">One-way</button>
        <button type="button" id="tab-roundtrip" class="trip-tab">Round-trip</button>
      </div>

      <form id="search-form">
        <div class="grid">
          <div>
            <label for="origin">Origin (IATA or City)</label>
            <input id="origin" list="airports-list" type="text" placeholder="AMS or Amsterdam" required />
          </div>
          <div>
            <label for="destination">Destination (IATA or City)</label>
            <input id="destination" list="airports-list" type="text" placeholder="LHR or London" required />
          </div>
          <div>
            <label for="departure_date">Departure Date</label>
            <input id="departure_date" type="date" required />
          </div>
          <div id="return-date-group" class="hidden">
            <label for="return_date">Return Date</label>
            <input id="return_date" type="date" />
          </div>
          <div>
            <label for="cabin">Cabin</label>
            <select id="cabin">
              <option value="economy" selected>Economy</option>
              <option value="premium_economy">Premium Economy</option>
              <option value="business">Business</option>
              <option value="first">First</option>
            </select>
          </div>
          <div>
            <label for="preferences">AI Priority</label>
            <input id="preferences" type="text" value="cheapest overall" placeholder="cheapest overall / nonstop / morning" />
          </div>
        </div>

        <label class="checkbox-row">
          <input id="has_carry_on" type="checkbox" />
          Include carry-on bag
        </label>

        <button id="search-btn" class="submit-btn" type="submit">Find Best Fare</button>
      </form>

      <datalist id="airports-list">
        <option value="Amsterdam (AMS)"></option>
        <option value="Rotterdam (RTM)"></option>
        <option value="Eindhoven (EIN)"></option>
        <option value="Brussels (BRU)"></option>
        <option value="London Heathrow (LHR)"></option>
        <option value="London Gatwick (LGW)"></option>
        <option value="London Stansted (STN)"></option>
        <option value="Manchester (MAN)"></option>
        <option value="Edinburgh (EDI)"></option>
        <option value="Dublin (DUB)"></option>
        <option value="Paris (CDG)"></option>
        <option value="Paris Orly (ORY)"></option>
        <option value="Nice (NCE)"></option>
        <option value="Lyon (LYS)"></option>
        <option value="Berlin (BER)"></option>
        <option value="Frankfurt (FRA)"></option>
        <option value="Munich (MUC)"></option>
        <option value="Hamburg (HAM)"></option>
        <option value="Dusseldorf (DUS)"></option>
        <option value="Zurich (ZRH)"></option>
        <option value="Geneva (GVA)"></option>
        <option value="Vienna (VIE)"></option>
        <option value="Madrid (MAD)"></option>
        <option value="Barcelona (BCN)"></option>
        <option value="Malaga (AGP)"></option>
        <option value="Palma de Mallorca (PMI)"></option>
        <option value="Lisbon (LIS)"></option>
        <option value="Porto (OPO)"></option>
        <option value="Rome (FCO)"></option>
        <option value="Milan (MXP)"></option>
        <option value="Venice (VCE)"></option>
        <option value="Athens (ATH)"></option>
        <option value="Istanbul (IST)"></option>
        <option value="Copenhagen (CPH)"></option>
        <option value="Stockholm (ARN)"></option>
        <option value="Oslo (OSL)"></option>
        <option value="Helsinki (HEL)"></option>
        <option value="Prague (PRG)"></option>
        <option value="Warsaw (WAW)"></option>
        <option value="Budapest (BUD)"></option>
        <option value="Dubai (DXB)"></option>
        <option value="Abu Dhabi (AUH)"></option>
        <option value="Doha (DOH)"></option>
        <option value="New York (JFK)"></option>
        <option value="Newark (EWR)"></option>
        <option value="Los Angeles (LAX)"></option>
        <option value="San Francisco (SFO)"></option>
        <option value="Chicago (ORD)"></option>
        <option value="Miami (MIA)"></option>
        <option value="Boston (BOS)"></option>
        <option value="Toronto (YYZ)"></option>
        <option value="Vancouver (YVR)"></option>
        <option value="Tokyo (HND)"></option>
        <option value="Seoul (ICN)"></option>
        <option value="Singapore (SIN)"></option>
        <option value="Bangkok (BKK)"></option>
        <option value="Bali (DPS)"></option>
        <option value="Hong Kong (HKG)"></option>
        <option value="Delhi (DEL)"></option>
        <option value="Mumbai (BOM)"></option>
        <option value="Bengaluru (BLR)"></option>
        <option value="Sydney (SYD)"></option>
        <option value="Melbourne (MEL)"></option>
      </datalist>

      <div id="status"></div>
    </div>

    <div id="best-result"></div>
    <div id="results"></div>
  </div>

  <script>
    const API_BASE = "https://truefare-guru-app.onrender.com";

    const form = document.getElementById("search-form");
    const statusBox = document.getElementById("status");
    const bestContainer = document.getElementById("best-result");
    const resultsContainer = document.getElementById("results");
    const searchBtn = document.getElementById("search-btn");

    const tabOneway = document.getElementById("tab-oneway");
    const tabRoundtrip = document.getElementById("tab-roundtrip");
    const returnDateGroup = document.getElementById("return-date-group");
    const returnDateInput = document.getElementById("return_date");
    let tripType = "oneway";

    function setTripType(type) {
      tripType = type;
      if (type === "roundtrip") {
        tabRoundtrip.classList.add("active");
        tabOneway.classList.remove("active");
        returnDateGroup.classList.remove("hidden");
        returnDateInput.required = true;
      } else {
        tabOneway.classList.add("active");
        tabRoundtrip.classList.remove("active");
        returnDateGroup.classList.add("hidden");
        returnDateInput.required = false;
        returnDateInput.value = "";
      }
    }

    tabOneway.addEventListener("click", () => setTripType("oneway"));
    tabRoundtrip.addEventListener("click", () => setTripType("roundtrip"));

    window.addEventListener("DOMContentLoaded", () => {
      fetch(`${API_BASE}/`).catch(() => {});
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const origin = document.getElementById("origin").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const departure_date = document.getElementById("departure_date").value;
      const return_date = tripType === "roundtrip" ? returnDateInput.value : "";
      const cabin = document.getElementById("cabin").value;
      const preferences = document.getElementById("preferences").value.trim() || "cheapest overall";
      const has_carry_on = document.getElementById("has_carry_on").checked;

      if (!origin || !destination || !departure_date) {
        showStatus("Please enter origin, destination, and departure date.", "error");
        return;
      }
      if (tripType === "roundtrip" && !return_date) {
        showStatus("Please select a return date for a round-trip search.", "error");
        return;
      }

      setLoading(true);
      showStatus("Searching live fares & analyzing best option...", "info");
      bestContainer.innerHTML = "";
      resultsContainer.innerHTML = "";

      try {
        const params = new URLSearchParams({
          origin,
          destination,
          departure_date,
          cabin,
          preferences,
          has_carry_on: String(has_carry_on)
        });
        if (return_date) params.set("return_date", return_date);

        const res = await fetch(`${API_BASE}/best-flight?${params.toString()}`);
        if (!res.ok) {
          throw new Error(`Server responded with status ${res.status}`);
        }

        const data = await res.json();
        const linksHtml = renderLinks(data.booking_links);

        if (data.error) {
          showStatus("No live seats returned — use direct search links below:", "info");
          bestContainer.innerHTML = `
            <div class="warn-box">
              <strong>Note:</strong> ${escapeHtml(data.error)}
              <div style="margin-top:8px; font-size:0.88rem;">Open your exact pre-filled search directly on:</div>
              ${linksHtml}
            </div>
          `;
          return;
        }

        const flights = data.raw_results || [];
        showStatus(`Found ${flights.length} live flight option${flights.length === 1 ? "" : "s"}.`, "success");

        bestContainer.innerHTML = `
          <div class="best-box">
            <h3>Guru Top Pick</h3>
            <div style="white-space: pre-wrap; color: #0f172a; font-size: 0.94rem; line-height: 1.5;">${escapeHtml(data.recommendation || "")}</div>
            ${linksHtml}
          </div>
        `;

        renderFlights(flights);
      } catch (err) {
        console.error("Flight search error:", err);
        showStatus(`Search failed: ${err.message}`, "error");
      } finally {
        setLoading(false);
      }
    });

    function renderLinks(links) {
      if (!links) return "";
      const labels = {
        google_flights: "Google Flights",
        skyscanner: "Skyscanner",
        kiwi: "Kiwi.com",
        kayak: "KAYAK"
      };
      const anchors = Object.entries(labels)
        .filter(([key]) => links[key])
        .map(([key, label]) => `<a class="link-btn" href="${escapeHtml(links[key])}" target="_blank" rel="noopener noreferrer">${label} &nearr;</a>`)
        .join("");
      return anchors ? `<div class="links-row">${anchors}</div>` : "";
    }

    function renderFlights(flights) {
      resultsContainer.innerHTML = flights.map((f) => {
        const stopsText = f.stops === 0 ? "Nonstop" : `${f.stops} stop(s)`;
        const linksHtml = renderLinks(f.booking_links);

        return `
          <div class="flight-card">
            <div class="flight-top">
              <div>
                <div style="font-weight: 700; font-size: 1.08rem;">${escapeHtml(f.airline || "Airline")} <span style="font-weight:400; color:#64748b; font-size:0.9rem;">(${escapeHtml(f.flight_numbers || "")})</span></div>
                <div style="color: #334155; margin-top: 4px; font-size: 0.93rem;">${escapeHtml(f.departure || "")} &rarr; ${escapeHtml(f.arrival || "")}</div>
                <div style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">
                  ${escapeHtml(f.route || "")} &middot; ${escapeHtml(f.cabin || "")} &middot; ${escapeHtml(stopsText)} &middot; ${escapeHtml(String(f.duration_mins || 0))} mins
                </div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 1.3rem; font-weight: 700; color: #0f172a;">&euro;${escapeHtml(String(f.price ?? "N/A"))}</div>
                <div style="font-size: 0.78rem; color: #64748b;">${escapeHtml(f.trip_type || "")}</div>
              </div>
            </div>
            ${linksHtml}
          </div>
        `;
      }).join("");
    }

    function showStatus(message, type) {
      const colors = { info: "#0369a1", success: "#15803d", error: "#b91c1c" };
      statusBox.style.color = colors[type] || "#334155";
      statusBox.textContent = message;
    }

    function setLoading(isLoading) {
      searchBtn.disabled = isLoading;
      searchBtn.textContent = isLoading ? "Searching..." : "Find Best Fare";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
